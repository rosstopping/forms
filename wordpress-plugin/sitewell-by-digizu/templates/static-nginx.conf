# Include inside a dedicated static server block. Replace __PUBLIC_PATH__ and
# __WORDPRESS_ORIGIN__ (a private WordPress listener, never this public host).
# WordPress's releases directory must not be exposed by another location.
root __PUBLIC_PATH__/current;
index index.html;
open_file_cache off;
etag on;
error_page 404 =404 @static_not_found;

# These are the only requests allowed to execute WordPress.
location ~ ^/(?:wp-admin(?:/|$)|wp-json(?:/|$)|wp-login\.php$|wp-cron\.php$|wp-comments-post\.php$|xmlrpc\.php$) {
    proxy_pass __WORDPRESS_ORIGIN__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
location = / {
    etag off;
    if_modified_since off;
    if ($arg_rest_route != "") { return 418; }
    error_page 418 = @wordpress_rest;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
location @wordpress_rest {
    proxy_pass __WORDPRESS_ORIGIN__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

# Only validated content hashes are immutable. Keep these files across releases.
location ~ "^/assets/(?:fonts|static)/[\w-]+\.[a-f0-9]{16}\.[a-z0-9]+$" {
    root __PUBLIC_PATH__;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
}
location ~ (?:^|/)\. { return 404; }
location ~* \.(?:php|phtml|phar)(?:/|$) { return 404; }
location = /_headers { return 404; }
location = /static-build-manifest.json { return 404; }
# Paths with extensions must resolve to an actual file, never a page fallback.
location ~ \.[^/]+$ {
    etag off;
    if_modified_since off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
}
location / {
    # ZIP mtimes and lengths can collide across releases; always refresh aliases/HTML.
    etag off;
    if_modified_since off;
    try_files $uri $uri/index.html $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
}
location @static_not_found {
    add_header Cache-Control "no-store" always;
    return 404;
}
